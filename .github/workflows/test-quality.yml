name: Test Quality Gate

on:
  pull_request:
    paths:
      - "tests/**"
      - "src/**"

jobs:
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir
          pip install pytest pytest-rerunfailures pytest-cov --no-cache-dir

      - name: Step 1 - Governance Effectiveness
        run: |
          echo "📊 Running Governance Effectiveness..."
          python -m pytest tests/governance/test_effectiveness_gate.py -v --tb=short

      - name: Step 2 - Security Tests
        run: |
          echo "🛡️ Running Security Tests..."
          python -m pytest tests/security/ -v --tb=short

      - name: Step 3 - Full Test Suite
        run: |
          echo "🧪 Running Full Test Suite..."
          python -m pytest tests/ -q --tb=short -W error::RuntimeWarning --ignore=tests/governance/test_p0_exposure.py
# TestAI 生产环境 Nginx 反向代理配置
#
# 功能:
# 1. HTTP(80) 反向代理到 api:8000 (FastAPI)
# 2. HTTPS(443) 占位 - 生产需放置真实 SSL 证书到 monitoring/nginx/ssl/
# 3. 健康检查端点 /health 直通
# 4. 基础安全头
#
# 部署前必须:
# - 在 monitoring/nginx/ssl/ 放置 fullchain.pem 和 privkey.pem
# - 或注释掉 HTTPS server 块，仅用 HTTP

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 基础优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;  # 允许较大请求体(测试用例上传)

    # 上游 API 服务 (docker-compose 服务名:端口)
    upstream testai_api {
        server api:8000;
        # 如有多个 api 副本,可在此添加(需移除 docker-compose 的 container_name)
        # server api2:8000;
        # server api3:8000;
    }

    # HTTP(80) - 反向代理 + 重定向到 HTTPS(若启用)
    server {
        listen 80;
        server_name _;

        # 健康检查端点直通(供 docker-compose healthcheck 使用)
        location /health {
            proxy_pass http://testai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API 文档
        location /docs {
            proxy_pass http://testai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 全部反代到 API
        location / {
            proxy_pass http://testai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持(若未来需要)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # HTTPS(443) - 生产 TLS 配置
    # 部署前需在 monitoring/nginx/ssl/ 放置证书:
    #   - fullchain.pem (证书链)
    #   - privkey.pem (私钥)
    # 若暂不启用 HTTPS,注释掉此 server 块
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /health {
            proxy_pass http://testai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://testai_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}

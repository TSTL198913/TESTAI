[pytest]
# 修复 PytestUnknownMarkWarning: 明确告知 pytest 使用 asyncio 插件
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 修复 PytestCollectionWarning: 明确定义测试文件的扫描规则
# 只扫描以 test_ 开头的模块，以 test_ 开头的函数，以及以 Test 开头的类
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# 测试超时配置
# 单个测试用例最大执行时间（秒）
timeout = 30

# 限制扫描路径，避免 Windows 系统目录权限问题
testpaths = tests/

# 禁用 pytest capture 系统 — 修复 ValueError: I/O operation on closed file
# 根因: pytest capture 使用内部 tmpfile 存储捕获的 stdout/stderr。
# 在 session teardown 时, tmpfile 被提前关闭 (与 -W error::RuntimeWarning 交互),
# 导致 _pytest/capture.py snap() 调用 self.tmpfile.seek(0) 时触发 ValueError。
# 此错误被 -W error::RuntimeWarning 升级, 导致 fixture setup/teardown 崩溃。
# --capture=no 完全禁用 capture, 消除 tmpfile 的使用。
# 安全性: 项目中无测试使用 capsys/capfd fixture (已验证)。
addopts = --capture=no

# 将警告转为错误 - CI质量门禁
# 关键警告转为错误，确保代码质量
filterwarnings =
    error::RuntimeWarning
    default::DeprecationWarning
    default::PendingDeprecationWarning
    error::SyntaxWarning
    error::ImportWarning
    default::ResourceWarning
    ignore::pytest.PytestCollectionWarning
    ignore::pytest.PytestUnraisableExceptionWarning